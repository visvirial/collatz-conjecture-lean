name = "collatz"
version = "0.1.0"
defaultTargets = ["Collatz"]
testDriver = "CollatzTest"

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

[[lean_lib]]
name = "Collatz"

[[lean_lib]]
name = "CollatzTest"

[[lean_exe]]
name = "collatz"
root = "Main"

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.36.0"

# CollatzBig (the 2^32 verification) is deliberately not a Lake target: its 6008 chunk modules
# are compiled with `lean -o` (scripts/distributed) and assembled by scripts/assemble_big.sh.
# `lake build` on them would recompile every chunk.
